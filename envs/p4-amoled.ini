; LilyGo T-Display P4, 4.1" AMOLED: ESP32-P4 (Arduino core 3.x via pioarduino),
; RM69A10 568x1232 MIPI-DSI + GT9895 touch, BQ27220 gauge, Wi-Fi through an
; ESP32-C6 (ESP-Hosted, SDIO). Two radio fits on one base board: SX1262 and
; LR2021. Platform, board JSON (boards/tdisplay_p4.json, verbatim) and flags are
; camillia-mt's [env:p4-amoled-sx1262] / [env:p4-amoled-lr2021] (camillia-mt
; 3777e74); see src/boards/tdisplay_p4/. Untested on hardware.
;
; BUILD WITH A SEPARATE PLATFORMIO CORE, as camillia-mt does:
;   PLATFORMIO_CORE_DIR=$HOME/.platformio-p4 pio run -e p4-amoled-sx1262
; pioarduino ships its own framework-arduinoespressif32 under the same package
; name as espressif32@7.0.1's, so installing it into the default core would
; swap Arduino 3.x in under every S3 env.
;
; Not `extends = common`: common's platform, board and memory type are the S3's.
; partitions_16mb_fs.csv is the S3 boards' table and suits this board as is: two
; 6.25 MB OTA slots plus the "littlefs" partition persistence.cpp mounts.
[env:p4-amoled-sx1262]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board     = tdisplay_p4
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed  = 1500000
board_build.flash_size    = 16MB
board_upload.flash_size   = 16MB
board_upload.maximum_size = 16777216
board_build.partitions    = partitions_16mb_fs.csv
board_build.filesystem    = littlefs
extra_scripts = pre:tools/set_app_version.py
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DRADIOLIB_EXCLUDE_APRS=1
    -DCS_BOARD_HEADER=\"boards/tdisplay_p4/board_tdisplay_p4.h\"
    -DCS_HW_MODEL=255
    -DDEVICE_TDISPLAY_P4=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Isrc
    -Isrc/boards/tdisplay_p4
    -std=gnu++17
    -Os
build_unflags = -std=gnu++11
lib_deps =
    jgromes/RadioLib@^7.7.1
    rweather/Crypto@^0.4.0
    knolleary/PubSubClient@^2.8
    lovyan03/LovyanGFX@1.2.30
    lvgl/lvgl@9.5.0
build_src_filter = +<*> ${board_src.exclude} +<status_display_lvgl.cpp> +<xl9555.cpp> +<boards/tdisplay_p4/>

; Same base board and radio pins, fitted with the LR2021 (TCXO at 3.3 V, see
; hal/hw_tdisplay_p4.h).
[env:p4-amoled-lr2021]
extends = env:p4-amoled-sx1262
build_flags =
    ${env:p4-amoled-sx1262.build_flags}
    -DMESH_LORA_LR2021=1
