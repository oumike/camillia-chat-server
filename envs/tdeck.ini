; LilyGo T-Deck: ST7789 320x240 + GT911 touch, SX1262, 8 MB octal PSRAM (so
; qio_opi). Pins are camillia-mt's src/hal/hw_tdeck.h and its [env:tdeck]
; (camillia-mt 3777e74); see src/boards/tdeck/. Untested on hardware.
[env:tdeck]
extends = common
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
build_flags =
    ${common.build_flags}
    -DCS_BOARD_HEADER=\"boards/tdeck/board_tdeck.h\"
    -DCS_HW_MODEL=50
    -DDEVICE_TDECK=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Isrc
lib_deps =
    ${common.lib_deps}
    lovyan03/LovyanGFX@1.2.27
    lvgl/lvgl@9.5.0
build_src_filter = +<*> ${board_src.exclude} +<status_display_lvgl.cpp> +<battery_adc.cpp> +<boards/tdeck/>
