; LilyGo T-Deck Pro: GDEQ031T10 e-paper (simple monochrome status page through
; GxEPD2, no LVGL), SX1262, BQ25896 charger ADC for the battery. 16 MB flash,
; quad PSRAM (qio_qspi). Pins are camillia-mt's src/hal/hw_tdeck_pro.h and its
; [env:tdeck-pro] (camillia-mt 3777e74); see src/boards/tdeck_pro/.
; Untested on hardware.
[env:tdeck-pro]
extends = common
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
build_flags =
    ${common.build_flags}
    -DCS_BOARD_HEADER=\"boards/tdeck_pro/board_tdeck_pro.h\"
    -DCS_HW_MODEL=102
    -DDEVICE_TDECK_PRO=1
    -Isrc
lib_deps =
    ${common.lib_deps}
    zinggjm/GxEPD2@1.6.9
    adafruit/Adafruit GFX Library@1.12.6
build_src_filter = +<*> ${board_src.exclude} +<boards/tdeck_pro/>
