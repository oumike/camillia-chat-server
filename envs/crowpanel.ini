; Elecrow CrowPanel Advance 3.5" and 5.0" HMI (ESP32-S3-WROOM-1-N16R8: 16 MB
; flash, 8 MB octal PSRAM, so qio_opi) with the SX1262 wireless module. Pins and
; panel configuration are camillia-mt's src/hal/hw_crowpanel_35.h,
; hw_crowpanel_50.h, display.h and crowpanel_50_display.h and its
; [env:crowpanel-35] / [env:crowpanel-50] (camillia-mt 3777e74); see
; src/boards/crowpanel/. Untested on hardware.
;
; build_flags restate common's rather than extending them: as on camillia-mt
; (and Meshtastic) the console is UART0 through the board's USB-UART bridge,
; so ARDUINO_USB_CDC_ON_BOOT is 0 here, not common's 1. On the 5.0" the S3's
; native USB pins (GPIO19/20) are the radio's RST and DIO1.

; 3.5": ILI9488 320x480 on SPI, run as 480x320 landscape; GT911 touch.
[env:crowpanel-35]
extends = common
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
; camillia-mt's LovyanGFX fix: a failed SPI DMA descriptor allocation drops a
; frame instead of panicking (the SoftAP is always up here). Inherited by the 5.0".
extra_scripts =
    pre:tools/set_app_version.py
    pre:tools/patch_lgfx_dmadesc.py
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1
    -DRADIOLIB_EXCLUDE_APRS=1
    -std=gnu++17
    -Os
    -DCS_BOARD_HEADER=\"boards/crowpanel/board_crowpanel.h\"
    -DCS_HW_MODEL=97
    -DDEVICE_CROWPANEL_35=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Isrc
lib_deps =
    ${common.lib_deps}
    lovyan03/LovyanGFX@1.2.27
    lvgl/lvgl@9.5.0
build_src_filter = +<*> ${board_src.exclude} +<status_display_lvgl.cpp> +<boards/crowpanel/>

; 5.0": 800x480 ST7262 on the 16-bit RGB bus, scanned out of a PSRAM
; framebuffer at camillia-mt's 14 MHz pixel clock (board_crowpanel.h). Backlight
; and touch reset on a PCA9557 (V1.0) or the board MCU (V1.1+), detected at
; boot. This build's radio NSS is V1.2/V1.3's GPIO8; add -DCROWPANEL_50_HW_V10=1
; for a V1.0 board. The DIP switch on the back must select the wireless module.
[env:crowpanel-50]
extends = env:crowpanel-35
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=1
    -DRADIOLIB_EXCLUDE_APRS=1
    -std=gnu++17
    -Os
    -DCS_BOARD_HEADER=\"boards/crowpanel/board_crowpanel.h\"
    -DCS_HW_MODEL=97
    -DDEVICE_CROWPANEL_50=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Isrc
