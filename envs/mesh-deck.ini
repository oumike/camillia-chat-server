; Attaky Mesh Deck 1.0: ESP32-S3-WROOM-1U-N16R8 (8 MB octal PSRAM, so
; qio_opi), ST7789 240x320 driven landscape + FT6636 touch, Ra-01SH SX1262
; (crystal, no TCXO), MAX17048 fuel gauge. Pins are camillia-mt's
; src/hal/hw_mesh_deck.h and its [env:mesh-deck] (camillia-mt 3777e74); see
; src/boards/mesh_deck/. Build-verified here; camillia-mt runs on hardware.
[env:mesh-deck]
extends = common
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
upload_speed = 1500000
; As camillia-mt: do not let esptool restart the board after flashing. A
; power-up boot is reliable; a warm reset over EN straight out of download
; mode is not (the panel lights, then it hangs until power is removed — state
; that survives a CPU reset in the expanders/panel/PSRAM). Flash, then power on.
board_upload.after_reset = no_reset
; Serial goes to UART0 (GPIO43/44) through the board's USB-UART bridge
; (/dev/cu.usbserial-*), not the S3's native USB, so CDC-on-boot and USB mode
; are 0 as in camillia-mt. The =1 values (common's, and the board definition's
; USB_MODE) are unflagged so the macros are not redefined with another value.
build_unflags =
    ${common.build_unflags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
build_flags =
    ${common.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -DCS_BOARD_HEADER=\"boards/mesh_deck/board_mesh_deck.h\"
    -DCS_HW_MODEL=255
    -DDEVICE_MESH_DECK=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Isrc
lib_deps =
    ${common.lib_deps}
    lovyan03/LovyanGFX@1.2.27
    lvgl/lvgl@9.5.0
build_src_filter = +<*> ${board_src.exclude} +<status_display_lvgl.cpp> +<boards/mesh_deck/>
