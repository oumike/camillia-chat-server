; LilyGo T-LoRa Pager: ST7796 480x222 (no touch), SX1262 behind an XL9555
; power rail, BQ25896 charger ADC for the battery, quad-SPI PSRAM (qio_qspi).
; Pins are camillia-mt's src/hal/hw_tlora_pager.h and its [env:tlora-pager-tft]
; (camillia-mt 3777e74); see src/boards/tlora_pager/. The LR1121 SKU is not
; built (PAGER_LORA_USE_LR1121 stays 0). Untested on hardware.
[env:tlora-pager-tft]
extends = common
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
build_flags =
    ${common.build_flags}
    -DCS_BOARD_HEADER=\"boards/tlora_pager/board_tlora_pager.h\"
    -DCS_HW_MODEL=103
    -DDEVICE_TLORA_PAGER_TFT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Isrc
    -Isrc/boards/tlora_pager
lib_deps =
    ${common.lib_deps}
    lovyan03/LovyanGFX@1.2.27
    lvgl/lvgl@9.5.0
build_src_filter = +<*> ${board_src.exclude} +<status_display_lvgl.cpp> +<xl9555.cpp> +<boards/tlora_pager/>
