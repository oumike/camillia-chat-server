; Elecrow ThinkNode M9: ST7789 320x240 (no touch; BOOT button wakes), LR1110,
; 8 MB octal PSRAM (so qio_opi). Pins are camillia-mt's src/hal/hw_m9.h and its
; [env:m9] (camillia-mt 3777e74); see src/boards/m9/. boards/thinknode_m9.json is
; camillia-mt's, verbatim (camillia-mt 3777e74: boards/thinknode_m9.json).
; Untested on hardware.
;
; The console is an external UART bridge, not native USB-CDC, so this env does
; not take common's ARDUINO_USB_CDC_ON_BOOT=1 (the board JSON sets it to 0);
; the rest of common.build_flags is repeated below without it.
;
; camillia-mt's [env:m9] also runs tools/patch_radiolib_lr11x0.py (old LR1110
; firmware rejects DriveDiosInSleepMode). It is not carried over: RadioLib 7.8.x,
; which ^7.7.1 resolves to, already skips that command on LR1110 firmware
; < 0x0306, and the script's pattern no longer matches there (camillia-mt's own
; m9 build at 3777e74 runs 7.8.1 unpatched for the same reason).
[env:m9]
extends = common
board = thinknode_m9
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DRADIOLIB_EXCLUDE_APRS=1
    -std=gnu++17
    -Os
    -DCS_BOARD_HEADER=\"boards/m9/board_m9.h\"
    -DCS_HW_MODEL=255
    -DDEVICE_M9=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Isrc
lib_deps =
    ${common.lib_deps}
    lovyan03/LovyanGFX@1.2.27
    lvgl/lvgl@9.5.0
build_src_filter = +<*> ${board_src.exclude} +<status_display_lvgl.cpp> +<battery_adc.cpp> +<boards/m9/>
