; camillia chat server — Heltec WiFi LoRa 32 V4 (plain, built-in OLED)

[env:heltec-v4]
platform  = espressif32@7.0.1
board     = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed  = 921600
board_build.arduino.memory_type = qio_qspi
board_build.flash_size          = 16MB
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216
board_build.partitions          = partitions_16mb_fs.csv
board_build.filesystem          = littlefs
extra_scripts = pre:tools/set_app_version.py
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DRADIOLIB_EXCLUDE_APRS=1
    -std=gnu++17
    -Os
build_unflags = -std=gnu++11
lib_deps =
    jgromes/RadioLib@^7.7.1
    rweather/Crypto@^0.4.0
    knolleary/PubSubClient@^2.8
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.1
build_src_filter = +<*>

; Same firmware plus the serial bench hook: type "req <slot> <cursor>" or "disc".
[env:heltec-v4-test]
extends = env:heltec-v4
build_flags = ${env:heltec-v4.build_flags} -DCS_SERIAL_TEST

[env:native]
platform = native
test_framework = unity
test_build_src = yes
lib_ignore = camillia_mesh
build_flags = -std=gnu++17
build_src_filter = +<cs_proto.cpp> +<channel_store.cpp> +<cs_server.cpp> +<sha256_portable.cpp> +<settings.cpp> +<settings_yaml.cpp> +<messages_json.cpp> +<airtime.cpp> +<battery_level.cpp> +<node_names.cpp> +<activity_log.cpp> +<page_cycler.cpp> +<display_text.cpp>
