; camillia chat server — Heltec WiFi LoRa 32 V4
;   heltec-v4            plain board, built-in OLED
;   heltec-v4-expansion  V4 on the TFT expansion kit (ST7789 + CHSC6X touch, LVGL)

; Shared by both device envs.
[common]
platform  = espressif32@7.0.1
board     = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed  = 921600
board_build.arduino.memory_type = qio_qspi
board_build.flash_size          = 16MB
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216
board_build.partitions          = partitions_16mb_fs.csv
board_build.filesystem          = littlefs
extra_scripts = pre:tools/set_app_version.py
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DRADIOLIB_EXCLUDE_APRS=1
    -std=gnu++17
    -Os
build_unflags = -std=gnu++11
lib_deps =
    jgromes/RadioLib@^7.7.1
    rweather/Crypto@^0.4.0
    knolleary/PubSubClient@^2.8

[env:heltec-v4]
extends = common
build_flags = ${common.build_flags}
lib_deps =
    ${common.lib_deps}
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.1
build_src_filter = +<*> -<status_display_lvgl.cpp> -<display_hal_*.cpp> -<board_init_v4_exp.cpp> -<board_init_wio_l2.cpp> -<battery_ads1115.cpp>

; The expansion kit takes GPIO17/18/21 (the OLED's SDA/SCL/RST), so it is a
; separate build rather than a runtime option.
[env:heltec-v4-expansion]
extends = common
build_flags =
    ${common.build_flags}
    -DCS_BOARD_V4_EXPANSION=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Isrc
lib_deps =
    ${common.lib_deps}
    lovyan03/LovyanGFX@^1.1.16
    lvgl/lvgl@9.5.0
    https://github.com/Quency-D/chsc6x/archive/3b2b6cebf3177b3e2c33d06e07909b0b10159516.zip
build_src_filter = +<*> -<status_display_oled.cpp> -<display_hal_wio_l2.cpp> -<board_init_v4.cpp> -<board_init_wio_l2.cpp> -<battery_ads1115.cpp>

; Same firmware plus the serial bench hook: type "req <slot> <cursor>" or "disc".
[env:heltec-v4-test]
extends = env:heltec-v4
build_flags = ${env:heltec-v4.build_flags} -DCS_SERIAL_TEST

[env:native]
platform = native
test_framework = unity
test_build_src = yes
lib_ignore = camillia_mesh
build_flags = -std=gnu++17
build_src_filter = +<cs_proto.cpp> +<channel_store.cpp> +<cs_server.cpp> +<sha256_portable.cpp> +<settings.cpp> +<settings_yaml.cpp> +<messages_json.cpp> +<airtime.cpp> +<battery_level.cpp> +<node_names.cpp> +<activity_log.cpp> +<page_cycler.cpp> +<display_text.cpp>
